server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
spring:
  application:
    name: nullpointer-pos-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nullpointer_pos}
    username: ${DB_USER:nullpointer}
    password: ${DB_PASSWORD:nullpointer_local_2026}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      pool-name: NullPointerHikariPool
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:NullPointerPOS-Local-Secret-For-Demo-Only-2026!ChangeBeforeProduction}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    org.springframework.security: INFO
    pe.upeu.nullpointerpos: INFO
