services:
  postgres:
    image: postgres:17-alpine
    container_name: nullpointer-pos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nullpointer_pos
      POSTGRES_USER: ${DB_USER:-nullpointer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nullpointer_local_2026}
      TZ: America/Lima
    ports:
      - "5432:5432"
    volumes:
      - nullpointer_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: nullpointer-pos-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/nullpointer_pos
      DB_USER: ${DB_USER:-nullpointer}
      DB_PASSWORD: ${DB_PASSWORD:-nullpointer_local_2026}
      DB_POOL_MAX: 10
      DB_POOL_MIN: 2
      JWT_SECRET: ${JWT_SECRET:-NullPointerPOS-Local-Secret-For-Demo-Only-2026!ChangeBeforeProduction}
      JWT_EXPIRATION_MINUTES: 480
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      TZ: America/Lima
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  nullpointer_pgdata:
